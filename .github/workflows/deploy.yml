name: Deploy to AWS

# Builds the web image (static React bundle on nginx), pushes it to Amazon ECR and rolls it
# out to an ECS Fargate service behind the same ALB as the API.
# Repository variables: AWS_REGION, AWS_DEPLOY_ROLE_ARN, ECR_REPOSITORY_WEB, ECS_CLUSTER, ECS_SERVICE_WEB
# Optional: VITE_API_URL (leave unset when the ALB routes /api/* to the API service).
# Without AWS_DEPLOY_ROLE_ARN the deploy job is skipped.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # GitHub OIDC -> AWS, no long-lived access keys

concurrency:
  group: deploy-web-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY_WEB }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          docker build --build-arg VITE_API_URL="$VITE_API_URL" \
            -t "$REGISTRY/$REPOSITORY:$IMAGE_TAG" -t "$REGISTRY/$REPOSITORY:latest" .
          docker push --all-tags "$REGISTRY/$REPOSITORY"
          echo "image=$REGISTRY/$REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Render task definition
        id: taskdef
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: .aws/task-definition.json
          container-name: web
          image: ${{ steps.image.outputs.image }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.taskdef.outputs.task-definition }}
          cluster: ${{ vars.ECS_CLUSTER }}
          service: ${{ vars.ECS_SERVICE_WEB }}
          wait-for-service-stability: true
